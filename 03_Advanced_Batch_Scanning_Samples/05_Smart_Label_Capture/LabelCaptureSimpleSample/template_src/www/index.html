<!doctype html>
<html>
  <head>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' data: gap: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data: content:;" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="viewport" content="width=device-width, user-scalable=no, viewport-fit=cover" />
    <title>LabelCaptureSimpleSample</title>

    <style>
      html,
      body {
        padding: 0;
        margin: 0;
      }

      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        position: absolute;
        font-family: Arial, Helvetica, sans-serif;
      }

      #data-capture-view {
        width: 100vw;
        height: 100vh;
      }

      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        box-sizing: border-box;
        z-index: 100;
      }

      .modal-overlay.hidden {
        display: none;
      }

      .modal-content {
        background-color: white;
        border-radius: 8px;
        padding: 24px;
        width: 100%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .modal-title {
        font-size: 18px;
        font-weight: bold;
        margin: 0 0 16px 0;
        text-align: center;
      }

      .modal-message {
        font-size: 14px;
        margin: 0 0 24px 0;
        text-align: left;
        width: 100%;
        white-space: pre-line;
      }

      .continue-button {
        background-color: #000000;
        color: #ffffff;
        border: none;
        border-radius: 4px;
        padding: 16px 24px;
        font-size: 14px;
        font-weight: bold;
        width: 100%;
        cursor: pointer;
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0">
    <div id="data-capture-view"></div>
    <div id="result-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <p class="modal-title">LABEL CAPTURED</p>
        <p id="modal-message" class="modal-message"></p>
        <button id="continue-button" class="continue-button" onclick="continueScan()">CONTINUE SCANNING</button>
      </div>
    </div>
    <script type="text/javascript" src="cordova.js"></script>
    <script type="text/javascript" src="index.js"></script>
  </body>
</html>
